<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkpad — Markdown notes</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">✍</span>
      <span>Inkpad</span>
      <button id="toggle-theme" class="icon-btn" title="Toggle theme">☾</button>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search notes…  (Ctrl+K)" autocomplete="off">
    </div>

    <button id="new-note" class="new-btn">＋ New note</button>

    <nav id="tag-list" class="tags" aria-label="Tags"></nav>

    <ul id="note-list" class="note-list"></ul>

    <div class="sidebar-footer">
      <button id="export" class="link-btn">Export</button>
      <label class="link-btn">
        Import
        <input id="import" type="file" accept="application/json" hidden>
      </label>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <span id="meta" class="meta"></span>
      <div class="toolbar-actions">
        <button id="toggle-mode" title="Toggle view (Ctrl+P)">Split</button>
        <button id="pin-note">Pin</button>
        <button id="delete-note" class="danger">Delete</button>
      </div>
    </header>

    <section id="workspace" class="workspace" data-mode="split">
      <textarea id="editor" class="editor" spellcheck="false" placeholder="Start writing…"></textarea>
      <article id="preview" class="preview markdown-body"></article>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
